<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Web Calculadora</title>
</head>

<body>
    <section class="header">WEB CALCULATOR</section>
    <main>
        <div id="calculator">
            <div class="display">0</div>

            <div class="buttons">
                <div class="clear-all" id="deletar-tudo" data-operacao="ca">CA</div>
                <div class="options" id="porcentagem" data-operacao="%">%</div>

                <div class="options" id="apagar" data-operacao=""><svg xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg></div>

                <div class="options operacoes" id="dividir" data-operacao="/">÷</div>


                <div class="numbers" data-valor="7">7</div>
                <div class="numbers" data-valor="8">8</div>
                <div class="numbers" data-valor="9">9</div>
                <div class="options operacoes" id="vezes" data-operacao="*">X</div>

                <div class="numbers" data-valor="4">4</div>
                <div class="numbers" data-valor="5">5</div>
                <div class="numbers" data-valor="6">6</div>
                <div class="options operacoes" id="mais" data-operacao="+">+</div>

                <div class="numbers" data-valor="1">1</div>
                <div class="numbers " data-valor="2">2</div>
                <div class="numbers" data-valor="3">3</div>
                <div class="options operacoes" id="menos" data-operacao="-">-</div>



                <div class="options" id="potencia" data-operacao="**">^</div>
                <div class="numbers" data-valor="0">0</div>
                <div class="options" id="ponto" data-operacao=".">.</div>
                <div class="options operacoes" id="ver-resultado">=</div>
            </div>
        </div>
    </main>
</body>
<script src="script.js"></script>

</html>
